name: Daily Horizon Summary

on:
  schedule:
    # 06:00 Asia/Shanghai (= 22:00 UTC previous calendar day)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      PUBLISH_MIN_GAP_DAYS: "3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Interval gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/publish_due.py --force
          else
            python3 scripts/publish_due.py
          fi

      - name: Set up Python
        if: steps.gate.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.due == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        if: steps.gate.outputs.due == 'true'
        run: uv sync

      - name: Prepare runtime config
        if: steps.gate.outputs.due == 'true'
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        if: steps.gate.outputs.due == 'true'
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: uv run horizon -l WARNING

      - name: Run Trending
        if: steps.gate.outputs.due == 'true'
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: uv run horizon-trending

      - name: Commit and push reports
        if: steps.gate.outputs.due == 'true'
        run: |
          git add -f data/summaries/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: daily report $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Filter inbox and send digest
        if: steps.gate.outputs.due == 'true'
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python3 scripts/digest_mail.py
