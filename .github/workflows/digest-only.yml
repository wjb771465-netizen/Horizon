name: Digest mail

on:
  schedule:
    - cron: '0 22 * * *'  # Every day at 06:00 UTC+8
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - name: Filter inbox (silent)
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python3 scripts/digest_mail.py --filter-only
