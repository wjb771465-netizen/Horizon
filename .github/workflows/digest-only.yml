name: Digest mail

on:
  schedule:
    - cron: '0 22 * * *'  # Every day at 06:00 UTC+8
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - name: Filter inbox (and send on manual runs)
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/digest_mail.py
          else
            python3 scripts/digest_mail.py --filter-only
          fi
